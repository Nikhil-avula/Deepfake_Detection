[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deepguard-ai"
version = "0.2.0"
description = "Video-only facial deepfake detection with measured pilot evaluation"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
deepguard = "deepguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_data: requires the owner's local uploaded videos and trained artifact"]
